server:
  port: 8083

spring:
  application:
    name: getway-service
  datasource:
    url: jdbc:mysql://localhost:3306/pet_getway?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
    gateway:
      routes:
        - id: pet-user
          uri: lb://user-service # lb代表负载均衡，去Nacos里找这个服务
          predicates:
            - Path=/user/** # 所有以 /user 开头的请求，都转发给用户服务
        - id: pet-service
          uri: lb://pet-service # 去Nacos里找宠物服务
          predicates:
            - Path=/pets/** # 所有以 /pet 开头的请求，都转发给宠物服务

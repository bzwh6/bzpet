server:
  port: 8082
spring:
  profiles:
    active: dev
  application:
    name: pet-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: true
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: true
          - data-id: shared-rabbitmq.yaml # 共享mq配置
            refresh: true
          - data-id: shared-mysql.yaml # 共享mysql配置
            refresh: true
          - data-id: shared-xxljob.yaml # 共享xxljob配置
            refresh: true
          - data-id: shared-sentinel.yaml # 共享sentinel配置
            refresh: true

# 日志格式：带上 requestId，便于按一次请求定位日志
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

bz:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.bzpet.petpet.controller
    title: 不知宠物 - 宠物微服务接口文档
    description: 该服务用于管理宠物相关信息
    contact-name: 不知宠物
    contact-url: http://www.bzpet.cn/
    contact-email: bzwh@bzpet.cn
    version: v1.0
  db:
    database: pet_pet
